<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chess Engine</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1e1e24;
      color: #eee;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 20px;
    }

    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 1px;
    }

    .subtitle {
      margin: -10px 0 0;
      color: #999;
      font-size: 14px;
    }

    /* ---------- Board ---------- */
    .board {
      --size: min(90vw, 560px);
      width: var(--size);
      height: var(--size);
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      user-select: none;
    }

    .square {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .light { background: #f0d9b5; }
    .dark  { background: #b58863; }

    .square.last.light { background: #f6eb72; }
    .square.last.dark  { background: #dcc34b; }
    .square.selected   { background: #8fbcdb !important; }
    .square.check      { background: radial-gradient(circle, #ff4d4d 0%, #e00 40%, transparent 75%) !important; }

    .square.target::after {
      content: "";
      width: 28%;
      height: 28%;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.22);
    }
    .square.capture::after {
      content: "";
      position: absolute;
      inset: 4%;
      border-radius: 50%;
      border: 5px solid rgba(0, 0, 0, 0.22);
    }

    .piece {
      font-size: calc(var(--size) / 8 * 0.78);
      line-height: 1;
      font-family: "Segoe UI Symbol", "DejaVu Sans", "Noto Sans Symbols 2", serif;
      pointer-events: none;
    }
    .piece.white {
      color: #fff;
      text-shadow: 0 0 2px #000, 0 0 2px #000, 0 2px 3px rgba(0, 0, 0, 0.6);
    }
    .piece.black {
      color: #1a1a1a;
      text-shadow: 0 0 1px #fff, 0 2px 3px rgba(0, 0, 0, 0.4);
    }

    .coord {
      position: absolute;
      font-size: 11px;
      font-weight: 600;
      pointer-events: none;
    }
    .coord.rank { top: 3px; left: 4px; }
    .coord.file { bottom: 2px; right: 4px; }
    .light .coord { color: #b58863; }
    .dark  .coord { color: #f0d9b5; }

    /* ---------- Status + ticker ---------- */
    .status {
      min-height: 24px;
      font-size: 18px;
      font-weight: 500;
    }

    /* NEW: the live "thinking" strip, a preview of the newspaper ticker */
    .ticker {
      width: min(90vw, 560px);
      min-height: 34px;
      padding: 8px 14px;
      background: #111;
      color: #9be29b;
      font-family: Consolas, "Courier New", monospace;
      font-size: 13px;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* NEW: a spinner that keeps spinning while the engine thinks.
       If the page were frozen, this would stop. */
    .spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      margin-right: 8px;
      border: 2px solid #9be29b;
      border-top-color: transparent;
      border-radius: 50%;
      vertical-align: -1px;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    button, select {
      font: inherit;
      font-size: 15px;
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }
    button {
      background: #6a9955;
      color: white;
      font-weight: 600;
    }
    button:hover { background: #7cb365; }
    select {
      background: #2d2d35;
      color: #eee;
    }

    .footer {
      color: #777;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1 id="title">Chess Engine</h1>
    <p class="subtitle">Written in C++ · compiled to WebAssembly · running on a Web Worker</p>

    <div class="board" id="board"></div>

    <div class="status" id="status">Loading engine...</div>
    <div class="ticker" id="ticker">engine idle</div>

    <div class="controls">
      <button id="newGame">New Game</button>
      <select id="depth">
        <option value="2">Easy</option>
        <option value="3" selected>Medium</option>
        <option value="4">Hard</option>
      </select>
    </div>

    <div class="footer">You play White. Click a piece, then click where to move it.</div>
  </div>

  <script>
    // ============ PERSONALIZE THESE ============
    const ENGINE_NAME  = 'Chess Engine';                      // ← your engine's name!
    const WIN_MESSAGE  = 'Checkmate! You beat me. ❤️';         // shown when HE wins
    const LOSE_MESSAGE = 'Checkmate. gotcha!I win this time 😏';      // shown when the engine wins
    const DRAW_MESSAGE = 'Stalemate. I guess We tied.';
    // ===========================================

    const GLYPHS = { k: '♚', q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };

    const boardEl  = document.getElementById('board');
    const statusEl = document.getElementById('status');
    const tickerEl = document.getElementById('ticker');
    const depthEl  = document.getElementById('depth');

    document.getElementById('title').textContent = ENGINE_NAME;
    document.title = ENGINE_NAME;

    // The engine runs on its own thread now. We talk to it with messages.
    const worker = new Worker('engine-worker.js');

    let state    = null;    // latest position from the engine: board, status, legal moves...
    let selected = -1;
    let targets  = [];
    let lastMove = [];
    let busy     = true;    // true until the engine has loaded, and while it thinks
    let gameOver = false;
    let considered = [];    // moves the engine has looked at this turn (for the ticker)

    function setStatus(text) { statusEl.textContent = text; }

    // ---------- Messages from the engine ----------
    worker.onmessage = (event) => {
      const msg = event.data;

      if (msg.type === 'ready' || msg.type === 'state') {
        state = msg.state;
        busy = false;
        render();
        setStatus('Your move.');
        tickerEl.textContent = 'engine idle';
      }

      if (msg.type === 'played') {
        state = msg.state;
        console.log('you played', msg.san);
        lastMove = [msg.from, msg.to];
        render();
        if (!checkGameOver()) engineTurn();
      }

      if (msg.type === 'considering') {
        // Arrives LIVE while the engine is still searching
        considered.push(msg.san);
        tickerEl.innerHTML = '<span class="spinner"></span>considering ' +
          considered.slice(-6).join(' … ');
      }

      if (msg.type === 'engineMoved') {
        state = msg.state;
        busy = false;
        const r = msg.result;
        if (r) {
          lastMove = [r.from, r.to];
          console.log('engine played', r);
          tickerEl.textContent = 'played ' + r.san + ' · searched ' +
            r.nodes.toLocaleString() + ' positions in ' + (r.ms / 1000).toFixed(2) + 's';
        }
        render();
        if (!checkGameOver()) {
          setStatus(state.status === 'check' ? 'Check! Your move.' : 'Your move.');
        }
      }
    };

    // ---------- Drawing ----------
    function render() {
      const b = state.board;

      let checkSq = -1;
      if (state.status === 'check' || state.status === 'checkmate') {
        checkSq = b.indexOf(state.whiteToMove ? 'K' : 'k');
      }

      boardEl.innerHTML = '';
      for (let sq = 0; sq < 64; sq++) {
        const row = Math.floor(sq / 8);
        const col = sq % 8;

        const div = document.createElement('div');
        div.className = 'square ' + ((row + col) % 2 === 0 ? 'light' : 'dark');
        if (lastMove.includes(sq)) div.classList.add('last');
        if (sq === selected)       div.classList.add('selected');
        if (sq === checkSq)        div.classList.add('check');
        if (targets.includes(sq))  div.classList.add(b[sq] === '.' ? 'target' : 'capture');

        const p = b[sq];
        if (p !== '.') {
          const span = document.createElement('span');
          span.className = 'piece ' + (p === p.toUpperCase() ? 'white' : 'black');
          span.textContent = GLYPHS[p.toLowerCase()] + '︎';
          div.appendChild(span);
        }

        if (col === 0) {
          const r = document.createElement('span');
          r.className = 'coord rank';
          r.textContent = 8 - row;
          div.appendChild(r);
        }
        if (row === 7) {
          const f = document.createElement('span');
          f.className = 'coord file';
          f.textContent = 'abcdefgh'[col];
          div.appendChild(f);
        }

        div.onclick = () => onSquareClick(sq);
        boardEl.appendChild(div);
      }
    }

    // ---------- Clicking ----------
    function onSquareClick(sq) {
      if (busy || gameOver || !state) return;

      // Clicked a highlighted target: send the move to the engine
      if (selected !== -1 && targets.includes(sq)) {
        busy = true;
        worker.postMessage({ type: 'playMove', from: selected, to: sq, promo: '' });
        selected = -1;
        targets = [];
        return;
      }

      // Clicked one of your own pieces: show its moves (instant, from the legal list)
      const p = state.board[sq];
      const isMine = p !== '.' && (p === p.toUpperCase()) === state.whiteToMove;
      if (isMine && sq !== selected) {
        selected = sq;
        targets = state.legal.filter(([from]) => from === sq).map(([, to]) => to);
      } else {
        selected = -1;
        targets = [];
      }
      render();
    }

    function engineTurn() {
      busy = true;
      considered = [];
      setStatus(ENGINE_NAME + ' is thinking...');
      tickerEl.innerHTML = '<span class="spinner"></span>thinking…';
      worker.postMessage({ type: 'engineMove', depth: Number(depthEl.value) });
    }

    // Returns true if the game just ended
    function checkGameOver() {
      if (state.status === 'checkmate') {
        gameOver = true;
        setStatus(state.whiteToMove ? LOSE_MESSAGE : WIN_MESSAGE);
        return true;
      }
      if (state.status === 'stalemate') {
        gameOver = true;
        setStatus(DRAW_MESSAGE);
        return true;
      }
      return false;
    }

    document.getElementById('newGame').onclick = () => {
      if (busy) return;
      selected = -1;
      targets = [];
      lastMove = [];
      gameOver = false;
      busy = true;
      worker.postMessage({ type: 'newGame' });
    };
  </script>
</body>
</html>
